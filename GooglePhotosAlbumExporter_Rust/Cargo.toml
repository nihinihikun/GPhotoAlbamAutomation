[package]
name = "gpae"
version = "0.2.0"
edition = "2021"
description = "Read-only local Google Photos album metadata exporter over CDP"
license = "MIT"

[dependencies]
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
rand = "0.8"
sha2 = "0.10"
fs2 = "0.4"
tempfile = "=3.12.0"
tungstenite = { version = "0.24", default-features = false, features = ["handshake"] }
